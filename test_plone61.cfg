[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-6.1.x.cfg
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/qa.cfg
    base.cfg

update-versions-file = test_plone61.cfg

# The viewlets reference content types from sibling packages, which are not
# installed in this single-package test buildout. The sibling src directories
# are added to sys.path so their interfaces can be imported by ZCML.
[test]
recipe = zc.recipe.testrunner
eggs = ${instance:eggs}
defaults = ['-s', 'sinar.activity', '--auto-color', '--auto-progress']
initialization =
    import os
    import sys
    os.environ['TZ'] = 'UTC'
    _here = [p for p in sys.path if p.endswith(os.path.join('sinar.activity', 'src'))]
    if _here:
        for _sib in ('sinar.resource',):
            sys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(_here[0])), _sib, 'src'))

[versions]
createcoverage = 1.5
